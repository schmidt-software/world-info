<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>World Info</title>
  <meta name="description" content="A live globe of events happening on Earth right now.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "topojson-client": "https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="globe"></div>

  <aside id="panel">
    <h1>World Info</h1>
    <p class="subtitle">Events happening on Earth right now</p>
    <button id="show-events" class="text-button" type="button">List all events</button>
    <ul id="layers"></ul>
    <p id="clock"></p>
  </aside>

  <section id="events-view" hidden aria-labelledby="events-title">
    <header>
      <h2 id="events-title">Events <span id="events-count"></span></h2>
      <button id="close-events" class="text-button" type="button">Close</button>
    </header>
    <div class="events-controls">
      <input id="events-search" type="search" placeholder="Search events" aria-label="Search events">
      <select id="events-layer" aria-label="Filter by layer"></select>
    </div>
    <p id="events-note" hidden></p>
    <div class="events-table">
      <table>
        <thead>
          <tr><th>When</th><th>Layer</th><th>Event</th><th>Link</th></tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
    </div>
  </section>

  <div id="zoom-controls" role="group" aria-label="Zoom">
    <button id="zoom-in" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button id="zoom-out" type="button" aria-label="Zoom out" title="Zoom out (-)">&minus;</button>
    <button id="zoom-reset" type="button" aria-label="Back to the whole globe" title="Back to the whole globe">&#8962;</button>
  </div>

  <div id="tooltip" hidden></div>

  <footer id="credits">
    Data:
    <a href="https://www.seismicportal.eu/" target="_blank" rel="noopener">EMSC</a>,
    <a href="https://earthquake.usgs.gov/earthquakes/feed/" target="_blank" rel="noopener">USGS</a>,
    <a href="https://www.dwd.de/" target="_blank" rel="noopener">DWD</a>,
    <a href="https://www.digitraffic.fi/en/" target="_blank" rel="noopener">Digitraffic</a>,
    <a href="https://eonet.gsfc.nasa.gov/" target="_blank" rel="noopener">NASA EONET</a>,
    <a href="https://www.gdacs.org/" target="_blank" rel="noopener">GDACS</a>,
    <a href="https://wheretheiss.at/" target="_blank" rel="noopener">wheretheiss.at</a><span id="snapshot-credits"></span>,
    borders <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
