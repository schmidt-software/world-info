name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax of all modules
        run: for file in site/src/*.js scripts/*.mjs scripts/sources/*.mjs; do node --check "$file"; done
      - name: Run parser tests
        run: node --test 'scripts/test/*.test.mjs'
